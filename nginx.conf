server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(mp3|wav|ogg|webp|png|jpg|jfif|svg|ico|css|js|woff2?)$ {
        expires 6M;
        add_header Cache-Control "public, immutable";
    }
}
